<div>
    <div class="modal-header">
        <h3>Edit permissions for {{ user.name }}</h3>
    </div>
    <div class="modal-body no-item-display">
        <ng-form role="form">
            <div class="checkbox">
                <label>
                    <input type="checkbox" ng-model="user.super_user" ng-disabled="!isSuperUser();"> Super User
                </label>
            </div>
            <label>Groups</label>
            <ul ng-if="!user.super_user">
                <li ng-repeat="(group,role) in user.roles">
                    <div class="form-group">
                        <a href="" class="btn btn-xs btn-primary" ng-click="deleteGroup(group);" ng-disabled="!canManageRole(group)">
                            <span class="glyphicon glyphicon-minus"></span>
                        </a>
                        <label for="role_{{ $index }}">{{ group }}</label>
                        <select id="role_{{ $index }}" ng-disabled="!canManageRole(group)" ng-model="user.roles[group]" ng-options="r for r in ['user','admin']">
                        </select>
                    </div>
                </li>
                <li ng-repeat="group in currGroups" ng-if="!user.roles[group]">
                    <div class="form-group" ng-disabled="!canManageRole(group)">
                        <a href="" class="btn btn-xs btn-primary" ng-click="deleteGroup(group);">
                            <span class="glyphicon glyphicon-minus"></span>
                        </a>
                        <label for="newrole_{{ $index }}">{{ group }}</label>
                        <select id="newrole_{{ $index }}" ng-model="user.roles[group]" ng-options="r for r in ['user','admin']"></select>
                    </div>
                </li>
                <li ng-if="isSuperUser()">
                    <div class="form-group">
                        <input ng-model="role.group" aria-label="New group" placeholder="group">
                        <select ng-model="role.role" aria-label="New group role" ng-options="r for r in ['user', 'admin']"></select>
                        <a href="" class="btn btn-xs btn-primary" ng-click="addRole();">
                            <span class="glyphicon glyphicon-plus"></span> Add
                        </a>
                    </div>
                </li>
            </ul>
        </ng-form>
    </div>
    <div class="modal-footer" ng-if="action != 'view'">
        <button ng-disabled="!hasChanged()" class="btn btn-primary" ng-click="save();">Save</button>
        <button class="btn btn-warning" ng-click="$dismiss('Cancel');">Cancel</button>
    </div>
    <div class="modal-footer" ng-if="action == 'view'">
        <button class="btn btn-warning" ng-click="$dismiss('Close');">Close</button>
    </div>
</div>
